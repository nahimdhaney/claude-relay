<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="claude-relay logo: a relay switch flipped from one contact to the other">
  <title>claude-relay</title>
  <style>
    .ink  { stroke: #14211F; fill: #14211F; }
    .line { stroke: #14211F; fill: none; }
    .off  { stroke: #8A9A97; fill: none; }
    .on   { stroke: #E08A1E; fill: #E08A1E; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #EAF2F0; fill: #EAF2F0; }
      .line { stroke: #EAF2F0; }
      .off  { stroke: #6B7C79; }
    }
  </style>
  <!-- input lead and pivot -->
  <line x1="6" y1="64" x2="24" y2="64" class="line" stroke-width="9" stroke-linecap="square"/>
  <circle cx="30" cy="64" r="11" class="ink"/>
  <!-- where the contact used to be -->
  <line x1="30" y1="64" x2="86" y2="96" class="off" stroke-width="5" stroke-dasharray="7 7"/>
  <!-- the switched contact -->
  <line x1="30" y1="64" x2="86" y2="32" class="line" stroke-width="10" stroke-linecap="round"/>
  <!-- active and idle terminals -->
  <circle cx="99" cy="26" r="11" class="on"/>
  <line x1="108" y1="26" x2="122" y2="26" class="on" stroke-width="9" stroke-linecap="square"/>
  <circle cx="99" cy="102" r="9" class="line" stroke-width="5"/>
  <line x1="108" y1="102" x2="122" y2="102" class="line" stroke-width="9" stroke-linecap="square"/>
</svg>
